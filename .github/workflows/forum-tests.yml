name: Forum monitor tests
on:
  push:
    paths: ['rm_forum_actions.py', 'test_rm_forum.py', '.github/workflows/forum-tests.yml']
  pull_request:
    paths: ['rm_forum_actions.py', 'test_rm_forum.py', '.github/workflows/forum-tests.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4
      - run: python -m unittest -v test_rm_forum
